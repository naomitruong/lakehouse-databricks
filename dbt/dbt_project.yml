name: 'lakehouse'
version: '1.0.0'
config-version: 2

profile: 'lakehouse'

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

models:
  lakehouse:
    bronze:
      +materialized: ephemeral
    silver:
      +materialized: incremental
      +schema: silver
      +on_schema_change: sync_all_columns
      +file_format: delta
    gold:
      +materialized: table
      +schema: gold
      +file_format: delta
