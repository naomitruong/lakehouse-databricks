# Replaces airflow/dags/dbt_orchestration_dag.py. Same layer-ordered task
# chain (bronze -> silver+tests -> gold+tests -> docs), hourly. The
# `dbt_task` type runs dbt directly against the SQL Warehouse — there is
# no "docker exec dbt dbt run" step and no dbt-ol / OpenLineage wrapper,
# because Unity Catalog captures table- and column-level lineage for every
# dbt model automatically (see governance/unity_catalog_lineage.md).

resources:
  jobs:
    dbt_orchestration_job:
      name: dbt-orchestration
      description: "Runs dbt models in layer order with quality tests after each layer. Replaces dbt_orchestration_dag."
      tags:
        project: lakehouse-databricks
        layer: silver-gold

      schedule:
        quartz_cron_expression: "0 0 */3 * * ?"
        timezone_id: "UTC"
        pause_status: UNPAUSED

      max_concurrent_runs: 1

      environments:
        - environment_key: dbt_env
          spec:
            environment_version: "2"
            dependencies:
              - dbt-databricks>=1.8,<2.0

      tasks:
        - task_key: dbt_run_bronze
          environment_key: dbt_env
          dbt_task:
            warehouse_id: ${var.sql_warehouse_id}
            catalog: ${var.uc_catalog}
            schema: bronze
            project_directory: ../dbt
            commands:
              - "dbt deps"
              - "dbt run --select bronze"

        - task_key: dbt_run_silver
          depends_on:
            - task_key: dbt_run_bronze
          environment_key: dbt_env
          dbt_task:
            warehouse_id: ${var.sql_warehouse_id}
            catalog: ${var.uc_catalog}
            schema: bronze
            project_directory: ../dbt
            commands:
              - "dbt deps"
              - "dbt run --select silver"

        - task_key: dbt_test_silver
          depends_on:
            - task_key: dbt_run_silver
          environment_key: dbt_env
          dbt_task:
            warehouse_id: ${var.sql_warehouse_id}
            catalog: ${var.uc_catalog}
            schema: bronze
            project_directory: ../dbt
            commands:
              - "dbt deps"
              - "dbt test --select silver"

        - task_key: dbt_run_gold
          depends_on:
            - task_key: dbt_run_silver
          environment_key: dbt_env
          dbt_task:
            warehouse_id: ${var.sql_warehouse_id}
            catalog: ${var.uc_catalog}
            schema: bronze
            project_directory: ../dbt
            commands:
              - "dbt deps"
              - "dbt run --select gold"

        - task_key: dbt_test_gold
          depends_on:
            - task_key: dbt_run_gold
          environment_key: dbt_env
          dbt_task:
            warehouse_id: ${var.sql_warehouse_id}
            catalog: ${var.uc_catalog}
            schema: bronze
            project_directory: ../dbt
            commands:
              - "dbt deps"
              - "dbt test --select gold"

        - task_key: dbt_generate_docs
          environment_key: dbt_env
          dbt_task:
            warehouse_id: ${var.sql_warehouse_id}
            catalog: ${var.uc_catalog}
            schema: bronze
            project_directory: ../dbt
            commands:
              - "dbt deps"
              - "dbt docs generate"
