resources:
  jobs:
    run_write_emp_data:
      name: run-write-emp-data
      description: "Demo job"
      tags:
        project: DABDemo

      max_concurrent_runs: 1

      tasks:
        - task_key: write_emp_data
          notebook_task:
            notebook_path: ../notebooks/Run_Write_Emp_Data.ipynb
            base_parameters:
              dept: offices

        - task_key: demo_repo_notebook
          depends_on:
            - task_key: write_emp_data
          notebook_task:
            notebook_path: ../notebooks/demo_repo_notebook.ipynb