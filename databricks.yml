bundle:
  name: DABDemo

include:
  - src/*.yml
  - src/env/*.yml
  - resources/jobs/*.yml
  - resources/pipelines/*.yml
  

sync:
  exclude:
    - ".env*"
    - "terraform/**"
    - "dbt/**"
    - "bi/**"
    - "debezium/**"
    - "governance/**"
    - "scripts/**"
    - "*.md"
    - "*.txt"
    - "index.html"
    - ".claude/**"

permissions:
  - group_name: de_grp
    level: CAN_MANAGE

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://dbc-ed5f809b-2c97.cloud.databricks.com/
  qa:
    default: false
    workspace:
      host: https://dbc-ed5f809b-2c97.cloud.databricks.com/

